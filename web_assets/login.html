<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | Pan-Tilt Camera</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <main class="login-form">
    <div class="wordmark">WAVESHARE <span>DEVICE CONTROL</span></div>
    <h1>Pan-Tilt Camera</h1>
    {% if demo %}<p class="mode-label">Simulation</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label for="password">Access password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      {% if error %}<p class="error-message" role="alert">{{ error }}</p>{% endif %}
      <button type="submit" class="primary">Sign In</button>
    </form>
  </main>
</body>
</html>
